name: CI

# When to run:
# - on pushes to the main branch
# - on every pull request
# - manually, via the "Run workflow" button on GitHub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# If new commits are pushed to the same branch, cancel the older run
# that is still in progress (saves time and CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest # a fresh, empty Linux machine rented from GitHub
    timeout-minutes: 15 # fail automatically if the job hangs for too long

    steps:
      - name: Download your code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # cache downloaded packages to speed up later runs

      # --ignore-scripts skips electron-builder's post-install step,
      # which CI does not need
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting (Prettier)
        run: npx prettier --check src electron.vite.config.ts vitest.config.ts eslint.config.mjs

      - name: Lint (code quality)
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npx electron-vite build